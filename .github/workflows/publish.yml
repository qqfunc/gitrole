name: Publish

on:
  release:
    types: [published]

jobs:
  run:
    name: Publish to PyPI
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: pypi
    steps:
    - name: Checkout ${{ github.repository }}
      uses: actions/checkout@v7.0.1
    - name: Install Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version-file: 'pyproject.toml'
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.0
      with:
        enable-cache: true
    - name: Build
      run: uv build
    - name: Publish
      run: uv publish
    - name: Prune uv cache
      run: uv cache prune --ci
